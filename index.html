<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var v = localStorage.getItem("memento-notes:sidebar-bg");
          if (v === null || v === "1")
            document.documentElement.dataset.splash = "1";
        } catch (e) {
          document.documentElement.dataset.splash = "1";
        }
        if (document.documentElement.dataset.splash === "1") {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href =
            "https://my-ledger.oss-cn-shenzhen.aliyuncs.com/banner163.png";
          document.head.appendChild(link);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Geist-Variable.woff2"
      crossorigin
    />
    <!-- LXGW 分段字体：相对路径 + unicode-range，勿 preload 整包 -->
    <link rel="stylesheet" href="/fonts/lxgw/result.css" />
    <link rel="stylesheet" href="/fonts/lxgw-mono/result.css" />
    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,viewport-fit=cover"
    />
    <meta name="description" content="浏览 GitHub 仓库中的 Markdown 笔记" />
    <title>Memento · 笔记</title>
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/Geist-Variable.woff2") format("woff2");
      }

      html:not([data-splash="1"]) #app-splash {
        display: none !important;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        min-height: 100svh;
        min-height: 100dvh;
        overflow: hidden;
        background: #04070e;
        color: rgba(245, 240, 255, 0.95);
        font-family: "Geist", "LXGWWenKai", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #app-splash .splash-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        animation: splashRise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      #app-splash .splash-banner {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 28%;
        transform: scale(1.06);
        opacity: 0.82;
        filter: saturate(1.08) brightness(1.02);
        animation: splashDrift 12s ease-in-out infinite alternate;
      }

      #app-splash .splash-veil {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(
            180deg,
            rgba(4, 7, 14, 0.08) 0%,
            rgba(4, 7, 14, 0.04) 36%,
            rgba(4, 7, 14, 0.38) 62%,
            rgba(4, 7, 14, 0.72) 100%
          ),
          radial-gradient(
            ellipse at 50% 18%,
            rgba(255, 154, 196, 0.14),
            transparent 55%
          );
      }

      #app-splash .splash-panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: max(40px, 8svh) 24px
          max(36px, calc(6svh + env(safe-area-inset-bottom, 0px)));
        text-align: center;
      }

      #app-splash .splash-brand {
        margin: 0;
        color: rgba(245, 240, 255, 0.78);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        text-shadow: 0 1px 18px rgba(0, 0, 0, 0.45);
      }

      #app-splash .splash-title {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 8px 0 0;
        color: rgba(245, 240, 255, 0.96);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1.35;
        text-shadow:
          0 1px 2px rgba(0, 0, 0, 0.35),
          0 8px 28px rgba(0, 0, 0, 0.4);
      }

      #app-splash .splash-dots {
        display: inline-flex;
        gap: 4px;
        min-width: 1.2em;
      }

      #app-splash .splash-dots span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(255, 182, 210, 0.95);
        box-shadow: 0 0 10px rgba(255, 154, 196, 0.55);
        animation: splashDot 1.2s ease-in-out infinite;
      }

      #app-splash .splash-dots span:nth-child(2) {
        animation-delay: 0.18s;
      }

      #app-splash .splash-dots span:nth-child(3) {
        animation-delay: 0.36s;
      }

      #app-splash .splash-label {
        margin: 8px 0 0;
        max-width: 22em;
        margin-left: auto;
        margin-right: auto;
        color: rgba(245, 240, 255, 0.68);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.03em;
        line-height: 1.55;
        text-shadow: 0 1px 14px rgba(0, 0, 0, 0.4);
      }

      #app-splash .splash-track {
        position: relative;
        width: min(280px, 72%);
        height: 7px;
        margin: 18px auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
      }

      #app-splash .splash-fill {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          #00f0ff 0%,
          #7c5cff 32%,
          #ff2d95 64%,
          #ffb86c 100%
        );
        box-shadow:
          0 0 10px rgba(0, 240, 255, 0.35),
          0 0 18px rgba(255, 45, 149, 0.28);
        transition: width 0.35s ease;
      }

      #app-splash .splash-percent {
        margin: 10px 0 0;
        color: rgba(245, 240, 255, 0.58);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.08em;
        font-variant-numeric: tabular-nums;
      }

      @keyframes splashDot {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }

      @keyframes splashRise {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes splashDrift {
        from {
          transform: scale(1.06) translateY(0);
        }
        to {
          transform: scale(1.12) translateY(-1.5%);
        }
      }

      @media (min-width: 861px) {
        #app-splash .splash-banner {
          object-position: center 50%;
        }
      }

      @media (max-width: 860px) {
        #app-splash .splash-panel {
          padding: max(32px, 6svh) 20px
            max(28px, calc(5svh + env(safe-area-inset-bottom, 0px)));
        }

        #app-splash .splash-title {
          font-size: 17px;
        }

        #app-splash .splash-label {
          font-size: 12px;
          line-height: 1.45;
        }

        #app-splash .splash-track {
          width: min(240px, 78%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-stage,
        #app-splash .splash-banner,
        #app-splash .splash-dots span,
        #app-splash .splash-fill {
          animation: none;
          transition: none;
        }

        #app-splash .splash-banner {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" role="status" aria-live="polite" aria-busy="true">
        <div class="splash-stage">
          <img
            class="splash-banner"
            src="https://my-ledger.oss-cn-shenzhen.aliyuncs.com/banner163.png"
            alt=""
            decoding="async"
            fetchpriority="high"
          />
          <div class="splash-veil" aria-hidden="true"></div>
          <div class="splash-panel">
            <p class="splash-brand">Memento</p>
            <p class="splash-title">
              <span>资源加载中</span>
              <span class="splash-dots" aria-hidden="true">
                <span></span><span></span><span></span>
              </span>
            </p>
            <p class="splash-label" id="splash-label">
              正在准备笔记空间，请稍候
            </p>
            <div class="splash-track" aria-hidden="true">
              <span class="splash-fill" id="splash-fill"></span>
            </div>
            <p class="splash-percent" id="splash-percent">0%</p>
          </div>
        </div>
      </div>
      <script>
        (function () {
          if (document.documentElement.dataset.splash !== "1") return;
          var fill = document.getElementById("splash-fill");
          var pctEl = document.getElementById("splash-percent");
          var labelEl = document.getElementById("splash-label");
          if (!fill || !pctEl) return;

          var reduce =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (reduce) {
            fill.style.width = "90%";
            pctEl.textContent = "90%";
            return;
          }

          var CAP = 90;
          var start = performance.now();
          var lastShown = -1;
          var labels = [
            [0, "正在准备笔记空间，请稍候"],
            [28, "正在加载核心资源…"],
            [55, "正在整理笔记环境…"],
            [78, "即将就绪…"],
          ];

          var tick = function (now) {
            var t = (now - start) / 1000;
            var p;
            if (t < 0.45) p = (t / 0.45) * 18;
            else if (t < 1.1) p = 18 + ((t - 0.45) / 0.65) * 24;
            else if (t < 1.85) p = 42 + ((t - 1.1) / 0.75) * 22;
            else if (t < 2.6) p = 64 + ((t - 1.85) / 0.75) * 14;
            else p = 78 + (1 - Math.exp(-(t - 2.6) * 0.55)) * (CAP - 78);

            p = Math.min(CAP, Math.round(p));
            if (p !== lastShown) {
              lastShown = p;
              fill.style.width = p + "%";
              pctEl.textContent = p + "%";
              for (var i = labels.length - 1; i >= 0; i--) {
                if (p >= labels[i][0]) {
                  if (labelEl) labelEl.textContent = labels[i][1];
                  break;
                }
              }
            }
            window.requestAnimationFrame(tick);
          };
          window.requestAnimationFrame(tick);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
