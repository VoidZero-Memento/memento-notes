<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var v = localStorage.getItem("memento-notes:sidebar-bg");
          if (v === null || v === "1")
            document.documentElement.dataset.splash = "1";
        } catch (e) {
          document.documentElement.dataset.splash = "1";
        }
        if (document.documentElement.dataset.splash === "1") {
          var pc = window.matchMedia("(min-width: 861px)").matches;
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = pc
            ? "https://my-ledger.oss-cn-shenzhen.aliyuncs.com/banner30.png"
            : "https://my-ledger.oss-cn-shenzhen.aliyuncs.com/banner163.png";
          document.head.appendChild(link);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Geist-Variable.woff2"
      crossorigin
    />
    <!-- LXGW 分段字体：相对路径 + unicode-range，勿 preload 整包 -->
    <link rel="stylesheet" href="/fonts/lxgw/result.css" />
    <link rel="stylesheet" href="/fonts/lxgw-mono/result.css" />
    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,viewport-fit=cover"
    />
    <meta name="description" content="浏览 GitHub 仓库中的 Markdown 笔记" />
    <title>Memento · 笔记</title>
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/Geist-Variable.woff2") format("woff2");
      }

      html:not([data-splash="1"]) #app-splash {
        display: none !important;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        min-height: 100svh;
        min-height: 100dvh;
        overflow: hidden;
        background: #04070e;
        color: rgba(245, 240, 255, 0.95);
        font-family:
          "Geist", "LXGWWenKai", "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #app-splash .splash-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        animation: splashRise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      #app-splash picture {
        display: block;
        width: 100%;
        height: 100%;
      }

      #app-splash .splash-banner {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 28%;
        transform-origin: 50% 40%;
        filter: saturate(1.08) contrast(1.03);
        animation: splashDrift 16s ease-in-out infinite alternate;
      }

      #app-splash .splash-veil {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          transparent 0%,
          transparent 50%,
          rgba(4, 7, 14, 0.22) 68%,
          rgba(4, 7, 14, 0.62) 82%,
          rgba(4, 7, 14, 0.92) 96%,
          rgba(4, 7, 14, 0.96) 100%
        );
      }

      #app-splash .splash-panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        padding: max(40px, 8svh) 20px
          max(28px, calc(5svh + env(safe-area-inset-bottom, 0px)));
      }

      #app-splash .splash-card {
        position: relative;
        width: min(320px, 100%);
        text-align: center;
        animation: splashCardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
      }

      #app-splash .splash-brand-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      #app-splash .splash-mark {
        position: relative;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        flex: none;
        background: conic-gradient(
          from 0deg,
          #00f0ff,
          #7c5cff,
          #ff2d95,
          #ffb86c,
          #00f0ff
        );
        box-shadow: 0 0 10px rgba(124, 92, 255, 0.55);
        animation: splashSpin 2.6s linear infinite;
      }

      #app-splash .splash-mark::after {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: #0b0a12;
      }

      #app-splash .splash-brand {
        margin: 0;
        color: rgba(245, 240, 255, 0.78);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        text-shadow: 0 1px 18px rgba(0, 0, 0, 0.45);
      }

      #app-splash .splash-title {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin: 10px 0 0;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1.35;
      }

      #app-splash .splash-title span:first-child {
        background: linear-gradient(
          92deg,
          #f5f0ff 0%,
          #cdeeff 45%,
          #ffd6ea 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
      }

      #app-splash .splash-dots {
        display: inline-flex;
        gap: 4px;
        min-width: 1.2em;
      }

      #app-splash .splash-dots span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(255, 182, 210, 0.95);
        box-shadow: 0 0 10px rgba(255, 154, 196, 0.55);
        animation: splashDot 1.2s ease-in-out infinite;
      }

      #app-splash .splash-dots span:nth-child(2) {
        animation-delay: 0.18s;
      }

      #app-splash .splash-dots span:nth-child(3) {
        animation-delay: 0.36s;
      }

      #app-splash .splash-progress-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 16px 0 0;
      }

      #app-splash .splash-track {
        position: relative;
        flex: none;
        width: min(200px, 60%);
        height: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          inset 0 1px 3px rgba(0, 0, 0, 0.5),
          0 2px 10px rgba(0, 0, 0, 0.35);
      }

      #app-splash .splash-fill {
        position: relative;
        display: block;
        height: 100%;
        width: 0%;
        overflow: hidden;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          #00f0ff 0%,
          #7c5cff 32%,
          #ff2d95 64%,
          #ffb86c 100%
        );
        box-shadow:
          0 0 10px rgba(0, 240, 255, 0.4),
          0 0 18px rgba(255, 45, 149, 0.32);
        transition: width 0.35s ease;
        animation: splashGlowPulse 2.2s ease-in-out infinite;
      }

      #app-splash .splash-fill-sheen {
        position: absolute;
        top: 0;
        bottom: 0;
        left: -60%;
        width: 45%;
        background: linear-gradient(
          100deg,
          transparent,
          rgba(255, 255, 255, 0.75),
          transparent
        );
        animation: splashSheen 1.8s ease-in-out infinite;
      }

      #app-splash .splash-percent {
        flex: none;
        min-width: 2.6em;
        margin: 0;
        color: rgba(245, 240, 255, 0.75);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-align: right;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
      }

      #app-splash .splash-label {
        margin: 12px 0 0;
        color: rgba(245, 240, 255, 0.68);
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: 0.02em;
        line-height: 1.5;
        text-shadow: 0 1px 14px rgba(0, 0, 0, 0.55);
      }

      @keyframes splashDot {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }

      @keyframes splashRise {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes splashCardIn {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes splashDrift {
        0% {
          transform: scale(1.05) translate(0, 0);
        }
        50% {
          transform: scale(1.1) translate(-1.2%, -1.8%);
        }
        100% {
          transform: scale(1.16) translate(1%, -2.6%);
        }
      }

      @keyframes splashSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes splashSheen {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(280%);
        }
      }

      @keyframes splashGlowPulse {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.18);
        }
      }

      @media (min-width: 861px) {
        #app-splash .splash-banner {
          object-position: center 50%;
        }
      }

      @media (max-width: 860px) {
        #app-splash .splash-panel {
          padding: max(32px, 6svh) 18px
            max(24px, calc(4svh + env(safe-area-inset-bottom, 0px)));
        }

        #app-splash .splash-title {
          font-size: 17px;
        }

        #app-splash .splash-label {
          font-size: 12px;
          line-height: 1.45;
        }

        #app-splash .splash-track {
          width: min(260px, 70%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-stage,
        #app-splash .splash-banner,
        #app-splash .splash-card,
        #app-splash .splash-mark,
        #app-splash .splash-dots span,
        #app-splash .splash-fill,
        #app-splash .splash-fill-sheen {
          animation: none;
          transition: none;
        }

        #app-splash .splash-banner {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" role="status" aria-live="polite" aria-busy="true">
        <div class="splash-stage">
          <picture>
            <source
              media="(min-width: 861px)"
              srcset="
                https://my-ledger.oss-cn-shenzhen.aliyuncs.com/banner30.png
              "
            />
            <img
              class="splash-banner"
              src="https://my-ledger.oss-cn-shenzhen.aliyuncs.com/banner163.png"
              alt=""
              decoding="async"
              fetchpriority="high"
            />
          </picture>
          <div class="splash-veil" aria-hidden="true"></div>
          <div class="splash-panel">
            <div class="splash-card">
              <div class="splash-brand-row">
                <span class="splash-mark" aria-hidden="true"></span>
                <p class="splash-brand">Memento</p>
              </div>
              <p class="splash-title">
                <span>资源加载中</span>
                <span class="splash-dots" aria-hidden="true">
                  <span></span><span></span><span></span>
                </span>
              </p>
              <div class="splash-progress-row">
                <div class="splash-track" aria-hidden="true">
                  <span class="splash-fill" id="splash-fill">
                    <span class="splash-fill-sheen"></span>
                  </span>
                </div>
                <p class="splash-percent" id="splash-percent">0%</p>
              </div>
              <p class="splash-label" id="splash-label">
                正在准备笔记空间，请稍候
              </p>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          if (document.documentElement.dataset.splash !== "1") return;
          var fill = document.getElementById("splash-fill");
          var pctEl = document.getElementById("splash-percent");
          var labelEl = document.getElementById("splash-label");
          if (!fill || !pctEl) return;

          var reduce =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (reduce) {
            fill.style.width = "90%";
            pctEl.textContent = "90%";
            return;
          }

          var CAP = 90;
          var start = performance.now();
          var lastShown = -1;
          var labels = [
            [0, "正在准备笔记空间，请稍候"],
            [28, "正在加载核心资源…"],
            [55, "正在整理笔记环境…"],
            [78, "即将就绪…"],
          ];

          var tick = function (now) {
            var t = (now - start) / 1000;
            var p;
            if (t < 0.45) p = (t / 0.45) * 18;
            else if (t < 1.1) p = 18 + ((t - 0.45) / 0.65) * 24;
            else if (t < 1.85) p = 42 + ((t - 1.1) / 0.75) * 22;
            else if (t < 2.6) p = 64 + ((t - 1.85) / 0.75) * 14;
            else p = 78 + (1 - Math.exp(-(t - 2.6) * 0.55)) * (CAP - 78);

            p = Math.min(CAP, Math.round(p));
            if (p !== lastShown) {
              lastShown = p;
              fill.style.width = p + "%";
              pctEl.textContent = p + "%";
              for (var i = labels.length - 1; i >= 0; i--) {
                if (p >= labels[i][0]) {
                  if (labelEl) labelEl.textContent = labels[i][1];
                  break;
                }
              }
            }
            window.requestAnimationFrame(tick);
          };
          window.requestAnimationFrame(tick);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
