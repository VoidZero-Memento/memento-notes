<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist-Variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/GeistMono-Variable.woff2" crossorigin />
    <link rel="preconnect" href="https://memento-static.oss-cn-shenzhen.aliyuncs.com" />
    <script>
      (function () {
        var month = new Date().getMonth();
        var start = month === 11 || month < 2 ? 3 : month < 5 ? 0 : month < 8 ? 1 : 2;
        var name = ["spring", "summer", "autumn", "winter"][start];
        document.documentElement.setAttribute("data-splash-season", String(start));
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.setAttribute("fetchpriority", "high");
        link.href = "https://memento-static.oss-cn-shenzhen.aliyuncs.com/common-images/" + name + ".jpg";
        document.head.appendChild(link);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Shippori+Mincho+B1:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/fonts/lxgw/result.css" />
    <link rel="stylesheet" href="/fonts/lxgw-mono/result.css" />
    <meta name="description" content="浏览 GitHub 仓库中的 Markdown 笔记" />
    <title>Memento · 笔记</title>
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/Geist-Variable.woff2") format("woff2");
      }

      @font-face {
        font-family: "GeistMono";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/GeistMono-Variable.woff2") format("woff2");
      }

      #app-splash {
        --paper: #f3ede2;
        --paper-dim: rgba(243, 237, 226, 0.72);
        --paper-faint: rgba(243, 237, 226, 0.46);
        --jp: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
        --en: "Cormorant Garamond", "Times New Roman", serif;
        --ease-ink: cubic-bezier(0.22, 0.8, 0.2, 1);
        --petal-a: 0.82;
        --petal-c1: #ffe3ea;
        --petal-c2: #f2a9bb;
        --petal-r: 60% 60% 60% 10%;
        --drift: -18vw;
        --spin: 680deg;
        --fade: 900ms;
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: #12181c;
        color: var(--paper);
        font-family: var(--jp);
        -webkit-font-smoothing: antialiased;
        opacity: 1;
        transition: opacity var(--fade) var(--ease-ink);
      }

      #app-splash.is-leave {
        opacity: 0;
        pointer-events: none;
      }

      #splash-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      #splash-bg img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        opacity: 0;
      }

      #splash-bg img.on {
        opacity: 1;
      }

      #splash-load {
        --gap: clamp(14px, 3.6vmin, 40px);
        --foot: calc(var(--gap) + 72px);
        --s: max(150px, min(520px, 64vmin, 100svh - var(--foot) - 2 * clamp(20px, 6svh, 64px)));
        position: absolute;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      #splash-load::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 44% 50% at 50% 42%, rgba(6, 7, 9, 0.62) 0%, rgba(6, 7, 9, 0.28) 46%, rgba(6, 7, 9, 0.05) 68%, transparent 78%);
      }

      #splash-load[data-season="summer"] { --petal-a: 0; }
      #splash-load[data-season="autumn"] { --petal-a: 0.9; --petal-c1: #f0c14a; --petal-c2: #c25a16; --petal-r: 74% 8% 68% 14%; --drift: -14vw; --spin: 480deg; }
      #splash-load[data-season="winter"] { --petal-a: 0.92; --petal-c1: #fff; --petal-c2: #e7f2f8; --petal-r: 50%; --drift: -4vw; --spin: 120deg; }

      #splash-load .stage {
        position: relative;
        z-index: 1;
        width: var(--s);
        aspect-ratio: 1;
        margin-bottom: var(--foot);
        display: grid;
        place-items: center;
        transition: transform var(--fade) var(--ease-ink), filter var(--fade) var(--ease-ink);
      }

      #app-splash.is-leave .stage {
        transform: scale(1.04);
        filter: blur(8px);
      }

      #splash-load svg.enso { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #splash-load .enso .ink { fill: var(--paper); opacity: 0.94; }

      #splash-load .title {
        writing-mode: vertical-rl;
        font-size: clamp(24px, calc(var(--s) * 0.123), 64px);
        font-weight: 800;
        letter-spacing: 0.24em;
        line-height: 1;
        text-shadow: 0 0 40px rgba(255, 210, 220, 0.14);
        display: flex;
        gap: 0.06em;
      }

      #splash-load .title span {
        opacity: 0;
        filter: blur(14px);
        transform: translateY(-0.18em) scale(1.08);
        animation: splash-glyph 1.6s var(--ease-ink) 0.65s forwards;
      }

      #splash-load .title span:nth-child(2) { animation-delay: 1.22s; }

      #splash-load .foot {
        position: absolute;
        top: calc(100% + var(--gap));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        white-space: nowrap;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45);
      }

      #splash-load .sub {
        font-family: var(--en);
        font-style: italic;
        font-size: 16px;
        letter-spacing: 0.56em;
        margin-right: -0.56em;
        text-transform: uppercase;
        color: var(--paper-dim);
      }

      #splash-load .motto {
        font-size: 14px;
        letter-spacing: 0.9em;
        margin-right: -0.9em;
        color: var(--paper-faint);
      }

      #splash-load .petal {
        position: absolute;
        z-index: 2;
        width: 10px;
        height: 7px;
        border-radius: var(--petal-r);
        background: linear-gradient(140deg, var(--petal-c1), var(--petal-c2));
        opacity: 0;
        animation: splash-petal linear infinite;
        pointer-events: none;
      }

      #splash-load[data-season="autumn"] .petal { width: 12px; height: 7px; }
      #splash-load[data-season="winter"] .petal { width: 5px; height: 5px; box-shadow: 0 0 6px rgba(255, 255, 255, 0.65); }

      @keyframes splash-petal {
        0% { transform: translate3d(0, -12vh, 0) rotate(0deg); opacity: 0; }
        12% { opacity: var(--petal-a); }
        100% { transform: translate3d(var(--drift), 112vh, 0) rotate(var(--spin)); opacity: 0; }
      }

      @keyframes splash-glyph {
        to { opacity: 1; filter: blur(0); transform: none; }
      }

      @keyframes splash-enso {
        from { stroke-dashoffset: var(--enso-len); }
        to { stroke-dashoffset: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash,
        #app-splash .stage,
        #splash-load .title span,
        #splash-load .petal {
          animation: none;
          transition: none;
        }

        #splash-load .petal { display: none; }

        #splash-load .title span {
          opacity: 1;
          filter: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-busy="true" aria-label="加载中">
      <div id="splash-bg">
        <img src="https://memento-static.oss-cn-shenzhen.aliyuncs.com/common-images/spring.jpg" alt="" decoding="async" />
        <img src="https://memento-static.oss-cn-shenzhen.aliyuncs.com/common-images/summer.jpg" alt="" decoding="async" />
        <img src="https://memento-static.oss-cn-shenzhen.aliyuncs.com/common-images/autumn.jpg" alt="" decoding="async" />
        <img src="https://memento-static.oss-cn-shenzhen.aliyuncs.com/common-images/winter.jpg" alt="" decoding="async" />
      </div>
      <div id="splash-load"></div>
    </div>
    <script>
      (function () {
        var HOLD = 5.6;
        var BLEND = 2;
        var SPAN = HOLD + BLEND;
        var NAMES = ["spring", "summer", "autumn", "winter"];
        var start = Number(document.documentElement.getAttribute("data-splash-season"));
        if (!(start >= 0 && start < 4)) {
          var month = new Date().getMonth();
          start = month === 11 || month < 2 ? 3 : month < 5 ? 0 : month < 8 ? 1 : 2;
        }
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var L = document.getElementById("splash-load");
        var splash = document.getElementById("app-splash");
        if (!L || !splash) return;
        var bgImgs = document.querySelectorAll("#splash-bg img");
        for (var s = 0; s < bgImgs.length; s++) bgImgs[s].classList.toggle("on", s === start);
        L.dataset.season = NAMES[start];

        var seasonAt = function (t) {
          var i = Math.floor(t / SPAN);
          var f = t / SPAN - i;
          var u = f <= HOLD / SPAN ? 0 : (f - HOLD / SPAN) / (BLEND / SPAN);
          var e = u * u * (3 - 2 * u);
          return i + e;
        };

        var el = function (tag, cls, html) {
          var node = document.createElement(tag);
          if (cls) node.className = cls;
          if (html != null) node.innerHTML = html;
          return node;
        };

        var ensoSvg = function () {
          var NS = "http://www.w3.org/2000/svg";
          var svg = document.createElementNS(NS, "svg");
          svg.setAttribute("viewBox", "0 0 200 200");
          svg.setAttribute("class", "enso");
          var seed = 7;
          var rnd = function () {
            seed = (seed * 16807) % 2147483647;
            return seed / 2147483647;
          };
          var N = 260;
          var a0 = (118 * Math.PI) / 180;
          var sweep = (336 * Math.PI) / 180;
          var ss = function (e0, e1, x) {
            var t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
            return t * t * (3 - 2 * t);
          };
          var centre = [];
          var i;
          for (i = 0; i <= N; i++) {
            var t = i / N;
            var a = a0 + t * sweep;
            var r = 72 + 2.2 * Math.sin(a * 3 + 1.1) + 1.3 * Math.sin(a * 5 + 0.3) - 3 * ss(0.85, 1, t);
            centre.push([100 + Math.cos(a) * r, 100 + Math.sin(a) * r, Math.cos(a), Math.sin(a)]);
          }
          var width = function (pt) {
            return 15 * (1 + 0.45 * Math.exp(-pt * 26)) * (1 - 0.62 * ss(0.45, 1, pt)) * (0.92 + 0.08 * Math.sin(pt * 19));
          };
          var d = "";
          var K = 15;
          var k;
          for (k = 0; k < K; k++) {
            var o = (k + 0.5) / K - 0.5;
            var edge = Math.abs(o) * 2;
            var tEnd = 1 - edge * edge * (0.18 + rnd() * 0.22) - rnd() * 0.04;
            var tStart = 0.028 * (1 - Math.sqrt(Math.max(0, 1 - edge * edge))) + rnd() * 0.003;
            var gap0 = edge > 0.5 && rnd() < 0.6 ? 0.55 + rnd() * 0.3 : 2;
            var gapL = 0.02 + rnd() * 0.05;
            var left = [];
            var right = [];
            for (i = 0; i <= N; i++) {
              t = i / N;
              if (t > tEnd) break;
              if (t < tStart) continue;
              var point = centre[i];
              var w = width(t);
              var hw = (w / K) * 0.95 * (0.35 + 0.65 * ss(tStart, tStart + 0.012, t)) * (1 - ss(tEnd - 0.06, tEnd, t));
              if (t > gap0 && t < gap0 + gapL) hw *= 0.08;
              var off = o * w + Math.sin(t * 40 + k) * 0.25;
              left.push((point[0] + point[2] * (off - hw)).toFixed(2) + " " + (point[1] + point[3] * (off - hw)).toFixed(2));
              right.push((point[0] + point[2] * (off + hw)).toFixed(2) + " " + (point[1] + point[3] * (off + hw)).toFixed(2));
            }
            if (left.length > 2) d += "M" + left.join("L") + "L" + right.reverse().join("L") + "Z";
          }
          var line = centre
            .map(function (point) {
              return point[0].toFixed(2) + " " + point[1].toFixed(2);
            })
            .join("L");
          svg.innerHTML =
            '<defs><filter id="splash-ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/></filter><mask id="splash-draw" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><path class="pen" d="M' +
            line +
            '" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round"/></mask></defs><g mask="url(#splash-draw)"><path class="ink" d="' +
            d +
            '"/></g>';
          return svg;
        };

        var stage = el("div", "stage");
        var svg = ensoSvg();
        var pen = svg.querySelector(".pen");
        stage.appendChild(svg);
        var title = el("div", "title", "<span>雨</span><span>皇</span>");
        stage.appendChild(title);
        stage.appendChild(el("div", "foot", '<div class="sub">Sakura Fantasy</div><div class="motto">一舟　四季　千灯</div>'));
        L.appendChild(stage);

        if (!reduce) {
          for (var n = 0; n < 22; n++) {
            var petal = el("div", "petal");
            petal.style.left = 4 + Math.random() * 92 + "vw";
            petal.style.animationDuration = 7 + Math.random() * 11 + "s";
            petal.style.animationDelay = -Math.random() * 16 + "s";
            L.appendChild(petal);
          }
        }

        var ink = svg.querySelector(".ink");
        var revealInk = function () {
          if (ink) ink.setAttribute("filter", "url(#splash-ink)");
        };
        if (!reduce && pen) {
          var penLen = pen.getTotalLength();
          pen.style.strokeDasharray = penLen + " " + penLen;
          pen.style.setProperty("--enso-len", penLen + "px");
          pen.style.strokeDashoffset = penLen + "px";
          pen.style.animation = "splash-enso 2.6s cubic-bezier(0.455, 0.03, 0.515, 0.955) forwards";
          pen.addEventListener("animationend", function (event) {
            if (event.animationName !== "splash-enso") return;
            revealInk();
          });
        } else {
          revealInk();
        }

        if (!reduce) {
          var imgs = Array.prototype.slice.call(document.querySelectorAll("#splash-bg img"));
          var t0 = performance.now();
          var lastOp = [];
          window.setTimeout(function () {
            var frame = function (now) {
              if (!splash.isConnected) return;
              var elapsed = (now - t0) / 1000;
              var season = start + seasonAt(elapsed);
              var idx = Math.floor(season) % 4;
              var f = season - Math.floor(season);
              var next = (idx + 1) % 4;
              imgs.forEach(function (img, index) {
                var opacity = index === idx ? 1 - f : index === next ? f : 0;
                var nextOp = opacity > 0.001 ? opacity.toFixed(3) : "0";
                if (lastOp[index] === nextOp) return;
                lastOp[index] = nextOp;
                img.style.opacity = nextOp;
              });
              var name = NAMES[Math.round(season) % 4];
              if (L.dataset.season !== name) L.dataset.season = name;
              var into = elapsed % SPAN;
              if (into < HOLD - 0.03) {
                window.setTimeout(function () {
                  requestAnimationFrame(frame);
                }, (HOLD - into) * 1000);
                return;
              }
              requestAnimationFrame(frame);
            };
            requestAnimationFrame(frame);
          }, HOLD * 1000);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
