<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Geist-Variable.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/GeistMono-Variable.woff2"
      crossorigin
    />
    <link
      rel="preconnect"
      href="https://memento-static.oss-cn-shenzhen.aliyuncs.com"
    />
    <link
      rel="preload"
      as="image"
      href="https://memento-static.oss-cn-shenzhen.aliyuncs.com/lite/loading/01.jpg"
      media="(max-width: 860px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="https://memento-static.oss-cn-shenzhen.aliyuncs.com/notes/pc-background.jpeg"
      media="(min-width: 861px)"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="/fonts/lxgw/result.css" />
    <link rel="stylesheet" href="/fonts/lxgw-mono/result.css" />
    <meta name="description" content="浏览 GitHub 仓库中的 Markdown 笔记" />
    <title>Memento · 笔记</title>
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/Geist-Variable.woff2") format("woff2");
      }

      @font-face {
        font-family: "GeistMono";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/GeistMono-Variable.woff2") format("woff2");
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: #04070e;
        opacity: 1;
        transition: opacity 0.45s ease;
      }

      #app-splash.is-leave {
        opacity: 0;
        pointer-events: none;
      }

      #splash-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        animation: splash-rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .splash-banner {
        position: absolute;
        inset: 0;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
      }

      .splash-banner.is-active {
        opacity: 1;
      }

      .splash-banner img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 40%;
        filter: saturate(1.08) contrast(1.03);
        animation: splash-drift 16s ease-in-out infinite alternate;
      }

      #splash-edge {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes splash-drift {
        0% {
          transform: scale(1.05) translate(0, 0);
        }
        50% {
          transform: scale(1.1) translate(-1.2%, -1.8%);
        }
        100% {
          transform: scale(1.16) translate(1%, -2.6%);
        }
      }

      @media (min-width: 861px) {
        .splash-banner img.splash-fill {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 80px;
          height: 80px;
          object-fit: cover;
          filter: blur(10px) saturate(1.2) brightness(0.4);
          transform: translate(-50%, -50%) scale(30);
          animation: none;
        }

        .splash-banner img.splash-portrait {
          position: absolute;
          inset: 0;
          z-index: 1;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center;
          filter: none;
          transform: none;
          animation: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash,
        #splash-stage,
        .splash-banner,
        .splash-banner img {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="app-splash"
      role="status"
      aria-live="polite"
      aria-busy="true"
      aria-label="加载中"
    >
      <div id="splash-stage"></div>
      <canvas id="splash-edge" aria-hidden="true"></canvas>
    </div>
    <script>
      (function () {
        var TICK_MS = 48;
        var LOAD_CAP = 90;
        var isPcSplash = window.matchMedia("(min-width: 861px)").matches;
        var PC_BG =
          "https://memento-static.oss-cn-shenzhen.aliyuncs.com/notes/pc-background.jpeg";
        var BANNER_COUNT = isPcSplash ? 1 : 15;
        var BANNER_INTERVAL_MS = 2000;
        var BANNER_RETRY_MS = 300;
        var BANNER_REVEAL_FALLBACK_MS = 1000;
        var FINISH_MS = 3000;
        var LEAVE_MS = 450;
        var BAND_WIDTH = 5;
        var INSET = BAND_WIDTH / 2;
        var SHEEN_LEN = 90;
        var SHEEN_PERIOD = 2400;
        var GRADIENT_STOPS = [
          [0, "#a8d8ff"],
          [0.3, "#d4b8ff"],
          [0.6, "#ff9ec4"],
          [0.85, "#ffc2e0"],
          [1, "#ffe58a"],
        ];

        var reduce = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        var splash = document.getElementById("app-splash");
        var stage = document.getElementById("splash-stage");
        var canvas = document.getElementById("splash-edge");
        if (!splash || !stage || !canvas) return;

        var loaded = new Set();
        var active = 0;
        var restMounted = false;
        var finishing = false;
        var progress = 0;
        var shown = 0;
        var bannerTimer = 0;
        var revealTimer = 0;
        var progressTimer = 0;
        var progressStartedAt = 0;
        var size = { w: 0, h: 0 };
        var ctx = canvas.getContext("2d");

        var bannerSrc = function (index) {
          if (isPcSplash) return PC_BG;
          var n = index + 1;
          return (
            "https://memento-static.oss-cn-shenzhen.aliyuncs.com/lite/loading/" +
            (n < 10 ? "0" : "") +
            n +
            ".jpg"
          );
        };

        var setActive = function (index) {
          active = index;
          var nodes = stage.children;
          for (var i = 0; i < nodes.length; i++) {
            nodes[i].classList.toggle(
              "is-active",
              Number(nodes[i].dataset.index) === index,
            );
          }
        };

        var revealRestBanners = function () {
          if (restMounted) return;
          restMounted = true;
          window.clearTimeout(revealTimer);
          revealTimer = 0;
          for (var i = 1; i < BANNER_COUNT; i++) mountBanner(i);
        };

        var markLoaded = function (index) {
          loaded.add(index);
          if (index === 0) revealRestBanners();
        };

        var markError = function (index) {
          loaded.delete(index);
          if (index === 0) revealRestBanners();
        };

        var mountBanner = function (index) {
          var wrap = document.createElement("div");
          wrap.className =
            "splash-banner" + (index === active ? " is-active" : "");
          wrap.dataset.index = String(index);
          var img = document.createElement("img");
          img.alt = "";
          img.className = isPcSplash ? "splash-fill" : "";
          img.decoding = "async";
          var settle = function () {
            if (img.dataset.settled) return;
            img.dataset.settled = "1";
            if (img.naturalWidth > 0) markLoaded(index);
            else markError(index);
          };
          img.addEventListener("load", settle);
          img.addEventListener("error", settle);
          img.src = bannerSrc(index);
          if (img.complete) settle();
          wrap.appendChild(img);
          if (isPcSplash) {
            var sharp = document.createElement("img");
            sharp.alt = "";
            sharp.className = "splash-portrait";
            sharp.decoding = "async";
            sharp.src = PC_BG;
            wrap.appendChild(sharp);
          }
          stage.appendChild(wrap);
        };

        var findNextLoaded = function (current) {
          for (var step = 1; step < BANNER_COUNT; step++) {
            var index = (current + step) % BANNER_COUNT;
            if (loaded.has(index)) return index;
          }
          return -1;
        };

        var startBannerCycle = function () {
          if (BANNER_COUNT < 2) return;
          var advance = function () {
            if (!splash.isConnected) return;
            var next = findNextLoaded(active);
            if (next !== -1) setActive(next);
            bannerTimer = window.setTimeout(advance, BANNER_INTERVAL_MS);
          };
          var pickRandomStart = function () {
            if (!splash.isConnected) return;
            var candidates = [];
            loaded.forEach(function (index) {
              if (index > 0) candidates.push(index);
            });
            if (!candidates.length) {
              bannerTimer = window.setTimeout(pickRandomStart, BANNER_RETRY_MS);
              return;
            }
            setActive(
              candidates[Math.floor(Math.random() * candidates.length)],
            );
            bannerTimer = window.setTimeout(advance, BANNER_INTERVAL_MS);
          };
          revealTimer = window.setTimeout(
            revealRestBanners,
            BANNER_REVEAL_FALLBACK_MS,
          );
          bannerTimer = window.setTimeout(pickRandomStart, BANNER_INTERVAL_MS);
        };

        var simulated = function (elapsedMs) {
          var t = elapsedMs / 1000;
          if (t < 0.45) return (t / 0.45) * 18;
          if (t < 1.1) return 18 + ((t - 0.45) / 0.65) * 24;
          if (t < 1.85) return 42 + ((t - 1.1) / 0.75) * 22;
          if (t < 2.6) return 64 + ((t - 1.85) / 0.75) * 14;
          return 78 + (1 - Math.exp(-(t - 2.6) * 0.55)) * (LOAD_CAP - 78);
        };

        var applyProgress = function (value) {
          progress = Math.min(100, Math.max(0, value));
        };

        var clearProgressTimer = function () {
          window.clearInterval(progressTimer);
          progressTimer = 0;
        };

        var buildHalfPath = function (w, h, side) {
          var cx = w / 2;
          var sideX = side < 0 ? INSET : w - INSET;
          ctx.beginPath();
          ctx.moveTo(cx, h - INSET);
          ctx.lineTo(sideX, h - INSET);
          ctx.lineTo(sideX, INSET);
          ctx.lineTo(cx, INSET);
        };

        var halfLength = function (w, h) {
          return w + h - 4 * INSET;
        };

        var strokeHalf = function (w, h, side, style, width, dash, offset) {
          buildHalfPath(w, h, side);
          ctx.strokeStyle = style;
          ctx.lineWidth = width;
          ctx.setLineDash(dash);
          ctx.lineDashOffset = offset;
          ctx.stroke();
        };

        var drawEdgeRing = function (w, h, ratio, time) {
          var total = halfLength(w, h);
          var filled = total * Math.min(1, Math.max(0, ratio));
          var gradient = ctx.createLinearGradient(0, h, 0, 0);
          GRADIENT_STOPS.forEach(function (stop) {
            gradient.addColorStop(stop[0], stop[1]);
          });
          var pulse = 0.5 + 0.5 * Math.sin(time / 380);
          var phase = (time % SHEEN_PERIOD) / SHEEN_PERIOD;
          var sheenStart = phase * (filled + SHEEN_LEN) - SHEEN_LEN;
          var sheenFrom = Math.max(0, sheenStart);
          var sheenTo = Math.min(filled, sheenStart + SHEEN_LEN);
          var sheenAlpha = Math.sin(phase * Math.PI) * 0.8;

          ctx.clearRect(0, 0, w, h);
          ctx.lineCap = "butt";
          ctx.lineJoin = "miter";
          [-1, 1].forEach(function (side) {
            strokeHalf(w, h, side, "rgba(255,255,255,0.16)", BAND_WIDTH, [], 0);
            if (filled <= 0) return;
            var dash = [filled, total * 2];
            ctx.globalAlpha = 0.22 + 0.16 * pulse;
            strokeHalf(w, h, side, gradient, BAND_WIDTH * 3.2, dash, 0);
            ctx.globalAlpha = 1;
            strokeHalf(w, h, side, gradient, BAND_WIDTH, dash, 0);
            if (sheenTo > sheenFrom) {
              ctx.globalAlpha = sheenAlpha;
              strokeHalf(
                w,
                h,
                side,
                "#ffffff",
                BAND_WIDTH * 0.7,
                [sheenTo - sheenFrom, total * 2],
                -sheenFrom,
              );
              ctx.globalAlpha = 1;
            }
          });
          ctx.setLineDash([]);
        };

        var resizeCanvas = function () {
          if (!ctx) return;
          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          size.w = splash.clientWidth;
          size.h = splash.clientHeight;
          canvas.width = Math.max(1, Math.round(size.w * dpr));
          canvas.height = Math.max(1, Math.round(size.h * dpr));
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };

        var leave = function () {
          window.clearTimeout(bannerTimer);
          window.clearTimeout(revealTimer);
          clearProgressTimer();
          splash.classList.add("is-leave");
          splash.setAttribute("aria-busy", "false");
          if (reduce) {
            splash.remove();
            return;
          }
          var settled = false;
          var done = function () {
            if (settled) return;
            settled = true;
            splash.remove();
          };
          splash.addEventListener("transitionend", function (event) {
            if (event.target !== splash || event.propertyName !== "opacity")
              return;
            done();
          });
          window.setTimeout(done, LEAVE_MS + 120);
        };

        var startFinishPhase = function () {
          if (finishing) return;
          finishing = true;
          clearProgressTimer();
          var from = Math.min(LOAD_CAP, progress || 0);
          applyProgress(from);
          progressStartedAt = Date.now();
          progressTimer = window.setInterval(function () {
            var elapsed = Date.now() - progressStartedAt;
            var t = Math.min(1, elapsed / FINISH_MS);
            applyProgress(from + (100 - from) * t);
            if (t < 1) return;
            clearProgressTimer();
            applyProgress(100);
            leave();
          }, TICK_MS);
        };

        var startWaitPhase = function () {
          clearProgressTimer();
          finishing = false;
          applyProgress(0);
          progressStartedAt = Date.now();
          progressTimer = window.setInterval(function () {
            if (finishing) return;
            applyProgress(
              Math.min(LOAD_CAP, simulated(Date.now() - progressStartedAt)),
            );
          }, TICK_MS);
        };

        mountBanner(0);
        startBannerCycle();
        startWaitPhase();

        if (ctx && !reduce) {
          resizeCanvas();
          if (typeof ResizeObserver === "function")
            new ResizeObserver(resizeCanvas).observe(splash);
          else window.addEventListener("resize", resizeCanvas);
          var render = function (time) {
            if (!splash.isConnected) return;
            shown += (progress - shown) * 0.18;
            if (size.w > 0 && size.h > 0)
              drawEdgeRing(size.w, size.h, shown / 100, time);
            window.requestAnimationFrame(render);
          };
          window.requestAnimationFrame(render);
        }

        splash.dataset.armed = "1";
        splash.addEventListener("memento-splash-ready", function () {
          if (reduce) {
            leave();
            return;
          }
          startFinishPhase();
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
